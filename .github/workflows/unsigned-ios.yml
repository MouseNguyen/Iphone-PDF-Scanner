name: Unsigned iPhone build
on:
  workflow_dispatch:
    inputs:
      free_quota_confirmed:
        description: Confirm remaining free macOS and artifact quota with paid overages disabled
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: unsigned-iphone-build
  cancel-in-progress: false
jobs:
  build:
    if: ${{ inputs.free_quota_confirmed }}
    runs-on: macos-26
    timeout-minutes: 45
    env:
      EXPO_NO_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.19.0'
      - name: Compile unsigned iPhone app
        run: bash scripts/build-unsigned-ios.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-iphone-app
          path: verification/cloud-build/PocketScanner-unsigned.ipa
          if-no-files-found: error
          retention-days: 1